schema: spec-driven

# Project context (shown to AI collaborators when creating artifacts).
context: |
  Product: an interactive sign-language *learning* app built on top of an existing
  BISINDO sign-language translator (Flask + Socket.IO in app.py; YOLOv8 `bisindo.pt`
  and `yolov8n.pt`; MediaPipe Hands; templates/ + static/).
  Goal: let students learn Indonesian↔English vocabulary and physically fingerspell
  words, verified live via camera, and quiz on their learned deck.
  Hard constraint: reuse existing computer-vision tech — do NOT train new models.
  Open decision: fingerspelling alphabet is ASL (as written in Features 1–2) vs
  BISINDO (existing app + Feature 4) — keep it configurable until product confirms.
  Active planning: openspec/changes/add-signlang-learning-suite/ (PRD package).
  Conventions: kebab-case capability paths; flat specs/ layout; conventional commits.

